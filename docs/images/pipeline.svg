<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .card  { fill: #ffffff; stroke: #cbd5d8; stroke-width: 1.2; }
    .stage { fill: #f1f7f6; stroke: #0f6f63; stroke-width: 1.4; }
    .opt   { fill: #e7f2f0; stroke: #0f6f63; stroke-width: 1.6; }
    .out   { fill: #fdf6ec; stroke: #b57a2a; stroke-width: 1.4; }
    .h     { font-size: 13.5px; font-weight: 700; fill: #16302c; }
    .s     { font-size: 11px; fill: #556360; }
    .n     { font-size: 10.5px; fill: #7c8b89; }
    .band  { font-size: 10.5px; font-weight: 700; fill: #0f6f63; letter-spacing: .08em; }
    .bandy { font-size: 10.5px; font-weight: 700; fill: #b57a2a; letter-spacing: .08em; }
    .arrow { stroke: #0f6f63; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .back  { stroke: #b57a2a; stroke-width: 1.4; fill: none;
             stroke-dasharray: 5 4; marker-end: url(#b); }
    .title { font-size: 16px; font-weight: 700; fill: #16302c; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f6f63"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b57a2a"/></marker>
  </defs>

  <text class="title" x="16" y="27">How one load profile becomes a drawing</text>
  <text class="n" x="16" y="45">The three boxes inside the dashed frame run once for every candidate design — hundreds of times in a study. Everything else runs once.</text>

  <!-- inputs -->
  <text class="band" x="16" y="80">WHAT YOU SUPPLY</text>
  <rect class="card" x="16" y="90" width="184" height="52" rx="8"/>
  <text class="h" x="30" y="112">Site</text>
  <text class="s" x="30" y="130">latitude, elevation, terrain</text>

  <rect class="card" x="16" y="150" width="184" height="52" rx="8"/>
  <text class="h" x="30" y="172">Load</text>
  <text class="s" x="30" y="190">8760 hourly kW</text>

  <rect class="card" x="16" y="210" width="184" height="52" rx="8"/>
  <text class="h" x="30" y="232">Components</text>
  <text class="s" x="30" y="250">one unit of each, and its cost</text>

  <rect class="card" x="16" y="270" width="184" height="52" rx="8"/>
  <text class="h" x="30" y="292">Economics</text>
  <text class="s" x="30" y="310">discount rate, tariff, horizon</text>

  <!-- resource -->
  <rect class="stage" x="232" y="90" width="188" height="78" rx="8"/>
  <text class="h" x="246" y="113">Resource data</text>
  <text class="s" x="246" y="131">PVGIS · NASA POWER ·</text>
  <text class="s" x="246" y="147">Open-Meteo · Solar Atlas</text>
  <text class="n" x="246" y="162">or synthesised from 12 months</text>

  <!-- the inner loop -->
  <rect x="232" y="196" width="472" height="150" rx="10"
        fill="#f8fbfb" stroke="#0f6f63" stroke-width="1.1" stroke-dasharray="6 4"/>
  <text class="band" x="246" y="218">EVALUATING ONE CANDIDATE DESIGN</text>

  <rect class="stage" x="246" y="230" width="140" height="62" rx="8"/>
  <text class="h" x="258" y="252">Dispatch</text>
  <text class="s" x="258" y="269">8760 hourly</text>
  <text class="s" x="258" y="284">energy balances</text>

  <rect class="stage" x="400" y="230" width="140" height="62" rx="8"/>
  <text class="h" x="412" y="252">Economics</text>
  <text class="s" x="412" y="269">NPC and LCOE</text>
  <text class="s" x="412" y="284">from the cash flows</text>

  <rect class="stage" x="554" y="230" width="136" height="62" rx="8"/>
  <text class="h" x="566" y="252">Metrics</text>
  <text class="s" x="566" y="269">LPSP, renewable</text>
  <text class="s" x="566" y="284">fraction, CO₂</text>

  <text class="n" x="246" y="318">Rule-based, hour by hour, one loop for all twenty technologies.</text>
  <text class="n" x="246" y="334">Energy in equals energy out to machine precision — checked by test.</text>

  <!-- optimiser -->
  <rect class="opt" x="736" y="196" width="248" height="150" rx="10"/>
  <text class="h" x="752" y="222">Optimiser</text>
  <text class="s" x="752" y="242">Particle swarm · NSGA-II ·</text>
  <text class="s" x="752" y="258">exhaustive search</text>
  <text class="n" x="752" y="282">Proposes a design, reads back its</text>
  <text class="n" x="752" y="297">objective vector, proposes a better</text>
  <text class="n" x="752" y="312">one. Returns a Pareto front —</text>
  <text class="n" x="752" y="327">a trade-off curve, not one answer.</text>

  <!-- outputs -->
  <text class="bandy" x="172" y="406">ONCE YOU PICK A DESIGN FROM THE FRONT</text>
  <rect class="out" x="16" y="420" width="228" height="60" rx="8"/>
  <text class="h" x="30" y="442">Electrical design</text>
  <text class="s" x="30" y="460">inverter, strings, cables,</text>
  <text class="s" x="30" y="474">protection, voltage level</text>

  <rect class="out" x="288" y="420" width="228" height="60" rx="8"/>
  <text class="h" x="302" y="442">Diagrams</text>
  <text class="s" x="302" y="460">single-line and three-line,</text>
  <text class="s" x="302" y="474">chosen from nine classes</text>

  <rect class="out" x="560" y="420" width="228" height="60" rx="8"/>
  <text class="h" x="574" y="442">Report</text>
  <text class="s" x="574" y="460">self-contained HTML,</text>
  <text class="s" x="574" y="474">English or Persian</text>

  <rect class="out" x="832" y="420" width="152" height="60" rx="8"/>
  <text class="h" x="846" y="442">Exports</text>
  <text class="s" x="846" y="460">SVG · CSV · JSON</text>

  <!-- flow -->
  <path class="arrow" d="M200,116 L226,116"/>
  <path class="arrow" d="M200,176 L216,176 L216,255 L240,255"/>
  <path class="arrow" d="M200,236 L216,236 L216,255"/>
  <path class="arrow" d="M200,296 L216,296 L216,262"/>
  <path class="arrow" d="M320,168 L320,224"/>
  <path class="arrow" d="M386,261 L394,261"/>
  <path class="arrow" d="M540,261 L548,261"/>
  <path class="arrow" d="M690,261 L730,261"/>
  <text class="n" x="700" y="249">score</text>

  <path class="back" d="M736,182 L300,182 L300,193"/>
  <text class="n" x="470" y="176">the next design to try</text>

  <path class="arrow" d="M860,346 L860,372 L130,372 L130,414"/>
  <path class="arrow" d="M248,450 L282,450"/>
  <path class="arrow" d="M520,450 L554,450"/>
  <path class="arrow" d="M792,450 L826,450"/>
</svg>
