<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .b1 { fill: #eef6f4; stroke: #0f6f63; stroke-width: 1.5; }
    .b2 { fill: #fdf4e8; stroke: #b57a2a; stroke-width: 1.5; }
    .b3 { fill: #eef2fa; stroke: #33569e; stroke-width: 1.5; }
    .b4 { fill: #f6eef6; stroke: #7d3f7d; stroke-width: 1.5; }
    .loop { fill: #ffffff; stroke: #16302c; stroke-width: 1.6; }
    .h  { font-size: 14px; font-weight: 700; fill: #16302c; }
    .q  { font-size: 11.5px; font-style: italic; fill: #16302c; }
    .s  { font-size: 11px; fill: #556360; }
    .n  { font-size: 10.5px; fill: #7c8b89; }
    .title { font-size: 16px; font-weight: 700; fill: #16302c; }
    .arrow { stroke: #16302c; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16302c"/></marker>
  </defs>

  <text class="title" x="16" y="27">Twenty technologies, four behaviours, one dispatch loop</text>
  <text class="n" x="16" y="45">The loop never learns what a technology is. It asks each asset one question, and the answer is the only thing that differs between a tidal turbine and a diesel set.</text>

  <rect class="b1" x="16" y="76" width="232" height="150" rx="9"/>
  <text class="h" x="32" y="100">Non-dispatchable</text>
  <text class="q" x="32" y="122">“How much are you making</text>
  <text class="q" x="32" y="137">this hour?”</text>
  <text class="s" x="32" y="162">PV (fixed, tracking, bifacial,</text>
  <text class="s" x="32" y="177">floating) · onshore, offshore</text>
  <text class="s" x="32" y="192">and small wind · run-of-river ·</text>
  <text class="s" x="32" y="207">tidal · wave</text>

  <rect class="b2" x="264" y="76" width="232" height="150" rx="9"/>
  <text class="h" x="280" y="100">Dispatchable</text>
  <text class="q" x="280" y="122">“How much could you make,</text>
  <text class="q" x="280" y="137">and what would it cost?”</text>
  <text class="s" x="280" y="162">Diesel and gas gensets ·</text>
  <text class="s" x="280" y="177">biomass and biogas · CHP ·</text>
  <text class="s" x="280" y="192">geothermal · fuel cell ·</text>
  <text class="s" x="280" y="207">reservoir hydro</text>

  <rect class="b3" x="512" y="76" width="232" height="150" rx="9"/>
  <text class="h" x="528" y="100">Storage</text>
  <text class="q" x="528" y="122">“How much can you take,</text>
  <text class="q" x="528" y="137">or give back?”</text>
  <text class="s" x="528" y="162">Lithium (NMC, LFP, LTO) ·</text>
  <text class="s" x="528" y="177">sodium-ion · lead-acid ·</text>
  <text class="s" x="528" y="192">flow · pumped hydro · flywheel ·</text>
  <text class="s" x="528" y="207">supercapacitor · CAES · thermal · H₂</text>

  <rect class="b4" x="760" y="76" width="224" height="150" rx="9"/>
  <text class="h" x="776" y="100">Flexible load</text>
  <text class="q" x="776" y="122">“How much do you want,</text>
  <text class="q" x="776" y="137">and when must you have it?”</text>
  <text class="s" x="776" y="162">EV fleets — six charging</text>
  <text class="s" x="776" y="177">strategies across five</text>
  <text class="s" x="776" y="192">archetypes, each with a hard</text>
  <text class="s" x="776" y="207">departure obligation</text>

  <path class="arrow" d="M132,226 L132,262"/>
  <path class="arrow" d="M380,226 L380,262"/>
  <path class="arrow" d="M628,226 L628,262"/>
  <path class="arrow" d="M872,226 L872,262"/>

  <rect class="loop" x="16" y="266" width="968" height="118" rx="10"/>
  <text class="h" x="34" y="292">One hour of dispatch, in priority order</text>
  <text class="s" x="34" y="316">1. serve the load from non-dispatchable output   →   2. shift flexible load into the surplus   →</text>
  <text class="s" x="34" y="334">3. charge storage   →   4. export within the limit   →   5. discharge storage   →   6. import   →</text>
  <text class="s" x="34" y="352">7. start dispatchable plant above its minimum load   →   8. whatever is left is unserved</text>
  <text class="n" x="34" y="372">Resolved once, as a single energy balance. Nothing charges and discharges in the same hour, and the hour is closed before the next begins.</text>

  <text class="n" x="16" y="416">Adding a technology means declaring which of the four it is and answering that one question. It does not mean touching the loop —</text>
  <text class="n" x="16" y="433">which is what keeps the conservation guarantee intact as the library grows, and why the guarantee is re-checked by test for every technology.</text>
  <text class="n" x="16" y="456">Worst hourly conservation error across all twenty technologies, six EV scenarios and four dispatch strategies: 5.7 × 10⁻¹⁴ kW.</text>
</svg>
