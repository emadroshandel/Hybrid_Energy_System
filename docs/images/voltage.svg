<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lv  { fill: #eef6f4; stroke: #0f6f63; stroke-width: 1.5; }
    .mv  { fill: #fdf4e8; stroke: #b57a2a; stroke-width: 1.5; }
    .q   { fill: #ffffff; stroke: #16302c; stroke-width: 1.5; }
    .h   { font-size: 13.5px; font-weight: 700; fill: #16302c; }
    .s   { font-size: 11px; fill: #556360; }
    .n   { font-size: 10.5px; fill: #7c8b89; }
    .m   { font-size: 11px; font-weight: 700; fill: #0f6f63; }
    .my  { font-size: 11px; font-weight: 700; fill: #b57a2a; }
    .title { font-size: 16px; font-weight: 700; fill: #16302c; }
    .arrow { stroke: #16302c; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
            markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16302c"/></marker>
  </defs>

  <text class="title" x="16" y="27">The question that decides the whole drawing</text>
  <text class="n" x="16" y="45">Sizing hands the electrical design a number of kilowatts. Everything on the sheet — cable size, transformer count,</text>
  <text class="n" x="16" y="61">which of the nine drawings gets drawn — follows from what is asked of that number first.</text>

  <rect class="q" x="16" y="78" width="300" height="76" rx="9"/>
  <text class="h" x="32" y="102">What current would this plant draw</text>
  <text class="h" x="32" y="120">at the site's low voltage?</text>
  <text class="n" x="32" y="142">I = P / (√3 · V · pf)</text>

  <path class="arrow" d="M166,154 L166,186"/>

  <rect class="lv" x="16" y="190" width="300" height="118" rx="9"/>
  <text class="m" x="32" y="212">UNDER 4,000 A  →  STAY AT LOW VOLTAGE</text>
  <text class="s" x="32" y="234">One connection at 400 V. Each machine gets its</text>
  <text class="s" x="32" y="250">own feeder; a feeder over 1,600 A is split, and</text>
  <text class="s" x="32" y="266">one over 2,000 A becomes bus duct rather than</text>
  <text class="s" x="32" y="282">conductors in parallel. A machine is never split:</text>
  <text class="s" x="32" y="298">a 3 MW turbine has one set of terminals.</text>

  <rect class="mv" x="352" y="190" width="316" height="118" rx="9"/>
  <text class="my" x="368" y="212">OVER 4,000 A  →  STEP UP</text>
  <text class="s" x="368" y="234">The site is connected at 3.3 to 33 kV, chosen from</text>
  <text class="s" x="368" y="250">the plant's kVA. Generation is still collected at low</text>
  <text class="s" x="368" y="266">voltage in blocks and stepped up: a transformer at</text>
  <text class="s" x="368" y="282">the base of every wind tower, and one per inverter</text>
  <text class="s" x="368" y="298">station — not one per inverter.</text>

  <path class="arrow" d="M316,232 L346,232"/>

  <rect class="q" x="704" y="190" width="280" height="140" rx="9"/>
  <text class="h" x="720" y="212">A machine bigger than 500 kW</text>
  <text class="s" x="720" y="234">is a 690 V machine, whatever the site voltage.</text>
  <text class="s" x="720" y="250">That is why the split is worked out twice: once</text>
  <text class="s" x="720" y="266">to find how large one unit is, then again at the</text>
  <text class="s" x="720" y="282">voltage that unit is actually built for. Asking</text>
  <text class="s" x="720" y="298">how many 400 V feeders a 3 MW turbine needs</text>
  <text class="s" x="720" y="314">is the wrong question.</text>

  <text class="h" x="16" y="352">What this prevents</text>
  <text class="s" x="16" y="374">Before the voltage was chosen rather than assumed, a 15 MW wind plant came out as 28,000 A on forty cables in parallel, with four of</text>
  <text class="s" x="16" y="392">five protective devices unable to protect their conductor. The arithmetic was right. The question was wrong — and a drawing that answers</text>
  <text class="s" x="16" y="410">the wrong question confidently is worse than one that answers nothing, because somebody will price it.</text>
  <text class="n" x="16" y="432">The design record carries the reason in words, and the report prints it — for example: “11,750 kW would be 17,852 A at 400 V, beyond the 4,000 A limit for a low-voltage connection.”</text>
</svg>
