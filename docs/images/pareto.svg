<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .ax  { stroke: #9aa8a6; stroke-width: 1.2; }
    .gr  { stroke: #e6ecec; stroke-width: 1; }
    .front { stroke: #0f6f63; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .h  { font-size: 14px; font-weight: 700; fill: #16302c; }
    .s  { font-size: 11px; fill: #556360; }
    .n  { font-size: 10.5px; fill: #7c8b89; }
    .lab { font-size: 10.5px; fill: #16302c; }
    .title { font-size: 16px; font-weight: 700; fill: #16302c; }
    .axl { font-size: 11.5px; fill: #556360; }
    .arrow { stroke: #16302c; stroke-width: 1.2; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
            markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16302c"/></marker>
  </defs>

  <text class="title" x="16" y="27">Why the answer is a curve and not a number</text>
  <text class="n" x="16" y="45">Two designs on the front are not better and worse than one another. They are different answers to a question nobody has asked you yet.</text>

  <!-- axes -->
  <line class="ax" x1="90" y1="340" x2="560" y2="340"/>
  <line class="ax" x1="90" y1="80"  x2="90"  y2="340"/>
  <text class="axl" x="325" y="366" text-anchor="middle">Net present cost  →  more expensive</text>
  <text class="axl" x="34" y="210" transform="rotate(-90 34 210)" text-anchor="middle">Renewable fraction  →</text>

  <line class="gr" x1="90" y1="290" x2="560" y2="290"/>
  <line class="gr" x1="90" y1="240" x2="560" y2="240"/>
  <line class="gr" x1="90" y1="190" x2="560" y2="190"/>
  <line class="gr" x1="90" y1="140" x2="560" y2="140"/>

  <!-- the front -->
  <path class="front" d="M140,300 L190,250 L250,215 L320,196 L400,178 L470,150 L520,110"/>
  <circle cx="140" cy="300" r="5.5" fill="#0f6f63"/>
  <circle cx="190" cy="250" r="5.5" fill="#0f6f63"/>
  <circle cx="250" cy="215" r="5.5" fill="#0f6f63"/>
  <circle cx="320" cy="196" r="8"   fill="#b57a2a" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="400" cy="178" r="5.5" fill="#0f6f63"/>
  <circle cx="470" cy="150" r="5.5" fill="#0f6f63"/>
  <circle cx="520" cy="110" r="5.5" fill="#0f6f63"/>

  <!-- dominated points -->
  <circle cx="300" cy="285" r="4.5" fill="#c2cbca"/>
  <circle cx="380" cy="255" r="4.5" fill="#c2cbca"/>
  <circle cx="450" cy="230" r="4.5" fill="#c2cbca"/>
  <circle cx="230" cy="305" r="4.5" fill="#c2cbca"/>

  <text class="lab" x="128" y="322">cheapest</text>
  <text class="lab" x="492" y="100">greenest</text>
  <text class="lab" x="300" y="182" text-anchor="middle">knee</text>

  <path class="arrow" d="M330,306 L372,262"/>
  <text class="n" x="222" y="322">dominated — some design on the front is</text>
  <text class="n" x="222" y="337">both cheaper and greener than this one</text>

  <!-- right panel -->
  <line class="gr" x1="612" y1="70" x2="612" y2="360" stroke="#dde4e3"/>

  <text class="h" x="636" y="92">Dominance</text>
  <text class="s" x="636" y="114">Design A dominates B when it is at least as good</text>
  <text class="s" x="636" y="130">on every objective and strictly better on one.</text>
  <text class="s" x="636" y="146">Anything nothing dominates is on the front.</text>

  <text class="h" x="636" y="182">Feasibility first</text>
  <text class="s" x="636" y="204">A design that breaks a constraint never beats one</text>
  <text class="s" x="636" y="220">that does not, however cheap it is. Between two</text>
  <text class="s" x="636" y="236">infeasible designs, the smaller violation wins — so</text>
  <text class="s" x="636" y="252">the search stays informed inside the infeasible</text>
  <text class="s" x="636" y="268">region without reporting anything from it.</text>

  <text class="h" x="636" y="304">The knee</text>
  <text class="s" x="636" y="326">Objectives normalised to [0,1] across the front, then</text>
  <text class="s" x="636" y="342">the point nearest the ideal corner. It is the design</text>
  <text class="s" x="636" y="358">to lead a report with — never the only one to show.</text>

  <text class="n" x="16" y="400">A single-objective optimiser would have to be told the exchange rate between money and carbon before it could start, and would then hide that</text>
  <text class="n" x="16" y="417">assumption inside one number. Reporting the curve puts the choice back where it belongs: with whoever is paying for the plant.</text>
</svg>
