<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" width="1020" height="490" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
 .title { font-size:16px; font-weight:700; fill:#16302c; }
 .n { font-size:10.5px; fill:#7c8b89; }
 .lab { font-size:12px; fill:#16302c; }
 .val { font-size:11.5px; font-weight:700; fill:#0f6f63; }
 .valp { font-size:11.5px; font-weight:700; fill:#b57a2a; }
 .ax { stroke:#a8b5b3; stroke-width:1.2; }
 .hd { font-size:10px; font-weight:700; fill:#0f6f63; letter-spacing:.07em; }
</style>
<text class="title" x="16" y="27">Six charging strategies, one identical site</text>
<text class="n" x="16" y="46">Twenty home charge points, the same vehicles arriving at the same times, on a time-of-use tariff: 8&#162;/kWh overnight, 18&#162; by day, 34&#162; in the evening peak.</text>
<text class="n" x="16" y="62">Only the control strategy changes. The bar is the change in the annual grid bill against uncontrolled charging.</text>
<text class="hd" x="16" y="90">STRATEGY</text>
<text class="hd" x="370" y="90">CHANGE IN THE ANNUAL GRID BILL</text>
<text class="hd" x="700" y="90">DELIVERED TO VEHICLES</text>
<text class="hd" x="930" y="90">MISSED</text>
<text class="lab" x="16" y="120">Uncontrolled</text>
<rect x="620.0" y="104" width="1.5" height="22" rx="3" fill="#0f6f63"/>
<text class="val" x="630" y="120">+0.0%</text>
<text class="n" x="700" y="120">212.6 MWh in</text>
<text class="n" x="946" y="120">0</text>
<text class="lab" x="16" y="166">Scheduled</text>
<rect x="226.7" y="150" width="393.3" height="22" rx="3" fill="#0f6f63"/>
<text class="val" x="630" y="166">-18.6%</text>
<text class="n" x="700" y="166">212.6 MWh in</text>
<text class="n" x="946" y="166">0</text>
<text class="lab" x="16" y="212">Price-responsive</text>
<rect x="220.0" y="196" width="400.0" height="22" rx="3" fill="#0f6f63"/>
<text class="val" x="630" y="212">-18.9%</text>
<text class="n" x="700" y="212">222.0 MWh in, 7.9 MWh back</text>
<text class="n" x="946" y="212">0</text>
<text class="lab" x="16" y="258">Smart (V1G)</text>
<rect x="226.7" y="242" width="393.3" height="22" rx="3" fill="#0f6f63"/>
<text class="val" x="630" y="258">-18.6%</text>
<text class="n" x="700" y="258">212.6 MWh in</text>
<text class="n" x="946" y="258">0</text>
<text class="lab" x="16" y="304">Vehicle-to-home</text>
<rect x="220.0" y="288" width="400.0" height="22" rx="3" fill="#0f6f63"/>
<text class="val" x="630" y="304">-18.9%</text>
<text class="n" x="700" y="304">222.0 MWh in, 7.9 MWh back</text>
<text class="n" x="946" y="304">0</text>
<text class="lab" x="16" y="350">Vehicle-to-grid</text>
<rect x="220.0" y="334" width="400.0" height="22" rx="3" fill="#0f6f63"/>
<text class="val" x="630" y="350">-18.9%</text>
<text class="n" x="700" y="350">222.0 MWh in, 7.9 MWh back</text>
<text class="n" x="946" y="350">0</text>
<line class="ax" x1="620" y1="96" x2="620" y2="364"/>
<text class="n" x="630" y="378">uncontrolled charging = 0%</text>
<text class="n" x="16" y="412">Every vehicle leaves at its target state of charge in all six cases. A strategy that saved money by stranding</text>
<text class="n" x="16" y="428">drivers would show missed departures, and would be reported as a failure rather than a saving. Smart charging</text>
<text class="n" x="16" y="444">moves the same energy into the overnight hours; the bidirectional cases move a little more, and give some back.</text>
<text class="n" x="16" y="468">V2G and V2H come out identical here because at a 5&#162; export price, selling back never covers the round trip plus</text>
<text class="n" x="16" y="484">4&#162;/kWh of battery degradation — so the model declines to do it, rather than doing it and calling it a saving.</text>
</svg>